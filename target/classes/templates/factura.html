<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Factura C</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 40px;
        }

        .contenedor {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border: 1px solid #ccc;
        }

        h1 {
            text-align: center;
        }

        h2 {
            margin-top: 30px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 8px;
        }

        .fila {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .campo {
            flex: 1;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        input[readonly] {
            background: #eeeeee;
        }

        .detalle {
            padding: 15px;
            margin-bottom: 15px;
            background: #fafafa;
            border: 1px solid #ddd;
        }

        .pago {
            padding: 15px;
            background: #f5f5f5;
            margin-top: 25px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        .agregar {
            background: #dddddd;
            color: black;
        }

        .emitir {
            background: black;
            color: white;
            display: block;
            width: 100%;
            font-size: 17px;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>Nueva Factura C</h1>

    <form action="/factura/emitir" method="post">

        <h2>Datos del Emisor</h2>

        <div class="fila">

            <div class="campo">
                <label>Nombre / Razón Social</label>

                <input
                        type="text"
                        name="nombreEmisor"
                        required>
            </div>

            <div class="campo">
                <label>Domicilio Comercial</label>

                <input
                        type="text"
                        name="domicilioEmisor"
                        required>
            </div>

        </div>


        <div class="fila">

            <div class="campo">
                <label>Condición frente al IVA</label>

                <input
                        type="text"
                        name="condicionIvaEmisor"
                        value="Monotributo"
                        required>
            </div>

            <div class="campo">
                <label>Ingresos Brutos</label>

                <input
                        type="text"
                        name="ingresosBrutos">
            </div>

            <div class="campo">
                <label>Inicio de Actividades</label>

                <input
                        type="date"
                        name="inicioActividades">
            </div>

        </div>


        <h2>Datos del Receptor</h2>

        <div class="fila">

            <div class="campo">
                <label>Nombre / Razón Social</label>

                <input
                        type="text"
                        name="nombreCliente"
                        required>
            </div>

            <div class="campo">
                <label>Domicilio</label>

                <input
                        type="text"
                        name="domicilioCliente"
                        required>
            </div>

        </div>


        <div class="fila">

            <div class="campo">

                <label>Condición frente al IVA</label>

                <input
                        type="text"
                        value="Consumidor Final"
                        readonly>

                <input
                        type="hidden"
                        name="condicionIvaCliente"
                        value="5">

            </div>


            <div class="campo">

                <label>Tipo de Documento</label>

                <select
                        name="tipoDocumento"
                        required>

                    <option value="96" selected>
                        DNI
                    </option>

                    <option value="80">
                        CUIT
                    </option>

                </select>

            </div>


            <div class="campo">

                <label>Número de Documento</label>

                <input
                        type="number"
                        name="numeroDocumento"
                        min="1"
                        required>

            </div>

        </div>


        <h2>Detalle de la Factura</h2>

        <div id="detalles">

            <div class="detalle">

                <div class="fila">

                    <div class="campo">

                        <label>Código</label>

                        <input
                                type="text"
                                name="detalles[0].codigo">

                    </div>


                    <div class="campo">

                        <label>Producto / Servicio</label>

                        <input
                                type="text"
                                name="detalles[0].descripcion"
                                required>

                    </div>

                </div>


                <div class="fila">

                    <div class="campo">

                        <label>Cantidad</label>

                        <input
                                type="number"
                                name="detalles[0].cantidad"
                                value="1"
                                min="1"
                                required>

                    </div>


                    <div class="campo">

                        <label>Unidad</label>

                        <select name="detalles[0].unidad">

                            <option value="Unidades">
                                Unidades
                            </option>

                            <option value="Kg">
                                Kg
                            </option>

                            <option value="Litros">
                                Litros
                            </option>

                        </select>

                    </div>


                    <div class="campo">

                        <label>Precio Unitario</label>

                        <input
                                type="number"
                                name="detalles[0].precioUnitario"
                                step="0.01"
                                min="0"
                                required>

                    </div>


                    <div class="campo">

                        <label>Descuento</label>

                        <input
                                type="number"
                                name="detalles[0].descuento"
                                value="0"
                                step="0.01"
                                min="0">

                    </div>

                </div>

            </div>

        </div>


        <button
                type="button"
                class="agregar"
                onclick="agregarProducto()">

            Agregar Producto

        </button>


        <div class="pago">

            <strong>Forma de Pago:</strong>
            Efectivo

            <br><br>

            <strong>Condición de Venta:</strong>
            Contado

        </div>


        <button
                type="submit"
                class="emitir">

            Emitir Factura

        </button>

    </form>

</div>


<script>

    let indice = 1;

    function agregarProducto() {

        const contenedor =
            document.getElementById("detalles");

        const detalle =
            document.createElement("div");

        detalle.className = "detalle";

        detalle.innerHTML = `

            <div class="fila">

                <div class="campo">

                    <label>Código</label>

                    <input
                        type="text"
                        name="detalles[${indice}].codigo">

                </div>


                <div class="campo">

                    <label>Producto / Servicio</label>

                    <input
                        type="text"
                        name="detalles[${indice}].descripcion"
                        required>

                </div>

            </div>


            <div class="fila">

                <div class="campo">

                    <label>Cantidad</label>

                    <input
                        type="number"
                        name="detalles[${indice}].cantidad"
                        value="1"
                        min="1"
                        required>

                </div>


                <div class="campo">

                    <label>Unidad</label>

                    <select
                        name="detalles[${indice}].unidad">

                        <option value="Unidades">
                            Unidades
                        </option>

                        <option value="Kg">
                            Kg
                        </option>

                        <option value="Litros">
                            Litros
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label>Precio Unitario</label>

                    <input
                        type="number"
                        name="detalles[${indice}].precioUnitario"
                        step="0.01"
                        min="0"
                        required>

                </div>


                <div class="campo">

                    <label>Descuento</label>

                    <input
                        type="number"
                        name="detalles[${indice}].descuento"
                        value="0"
                        step="0.01"
                        min="0">

                </div>

            </div>

        `;

        contenedor.appendChild(detalle);

        indice++;
    }

</script>

</body>
</html>
